services:
  # PostgreSQL: Used for relational, ACID-compliant data (Users & Wallets)
  postgres:
    image: postgres:16-alpine
    container_name: food_delivery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-food_delivery}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-food_delivery}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MongoDB: Used for flexible, nested, document-based catalog (Restaurant Menu Items & Customizations)
  mongo:
    image: mongo:7.0
    container_name: food_delivery_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis: Used for high-throughput, low-latency ephemeral state with TTL (Live Driver Tracking)
  redis:
    image: redis:7-alpine
    container_name: food_delivery_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
